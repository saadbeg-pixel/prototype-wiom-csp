<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>होम — कार्ड हटा · Wiom CSP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../_common/tokens.css" />
  <link rel="stylesheet" href="../_common/frame.css" />
  <link rel="stylesheet" href="../_common/components.css" />
  <style>
    .tap-hint {
      position: absolute; bottom: 24px; left: 16px; right: 16px;
      text-align: center; font-size: 11px; color: var(--text-secondary);
      pointer-events: none; letter-spacing: 0.3px;
    }
    .tap-hint::before { content: "↑ "; color: var(--brand-primary); }
    .toast-prototype {
      position: absolute; top: 96px; left: 16px; right: 16px;
      background: var(--text-primary); color: var(--text-inverse);
      padding: 12px 16px; border-radius: var(--radius-card);
      font-size: var(--t-body); z-index: 200;
      box-shadow: 0 4px 12px rgba(22, 16, 33, 0.3);
      animation: toast-in 0.3s ease-out;
      display: flex; align-items: center; gap: 8px;
    }
    .archive-empty {
      margin: 24px 16px 0;
      padding: 24px 16px;
      background: var(--bg-surface);
      border: 1px dashed var(--stroke-secondary);
      border-radius: var(--radius-card);
      text-align: center;
      font-size: var(--t-body-sm);
      color: var(--text-hint);
    }
  </style>
</head>
<body>
  <div class="frame-hint">flow 2 · f2-4 — home (card removed)</div>
  <div class="phone-bezel">
    <div class="phone-notch"></div>
    <div class="phone-screen">
      <div class="status-bar light"><span>11:59</span><span class="status-icons">●●● 􀙇 78%</span></div>
      <div class="screen-content app">

        <div class="top-bar">
          <button class="top-bar__icon-btn" data-inert>☰</button>
          <span class="top-bar__title">साद · पार्टनर</span>
          <button class="top-bar__icon-btn" data-inert>🔔</button>
        </div>

        <div class="toast-prototype">
          <span>ⓘ</span>
          <span>बुकिंग रद्द हो गई · बोनस पर असर नहीं</span>
        </div>

        <div class="strip">
          <div class="chip" data-inert>
            <span class="chip__label">कनेक्शन</span>
            <span class="chip__value">11 <span class="chip__sub">(15)</span></span>
          </div>
          <div class="chip" data-inert>
            <span class="chip__label">सेवा स्थिति</span>
            <span class="chip__check">✓</span>
          </div>
          <div class="chip" data-inert>
            <span class="chip__label">कमाई</span>
            <span class="chip__value">₹4,250</span>
          </div>
          <div class="chip" data-inert>
            <span class="chip__label">काम की स्थिति</span>
            <span class="chip__check">✓</span>
          </div>
        </div>

        <!-- Install card gone. Only restore card remains. -->
        <div style="margin-top: 8px">
          <div class="card" data-inert>
            <div class="card__accent"></div>
            <div class="card__body">
              <div class="card__line1">
                <span class="card__icon">🛠</span>
                <span>रिस्टोर · #3104</span>
                <span class="card__locality"> · द्वारका</span>
              </div>
              <div class="card__line2">
                <span class="card__reason">कनेक्शन ने नया मुद्दा बताया</span>
                <span class="card__timestamp">कल 2:15 PM</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Archive empty — section gone -->

        <div style="height: 80px"></div>
        <div class="tap-hint" data-goto="f2-end.html" style="pointer-events: auto; cursor: pointer">कहानी पूरी देखें →</div>
      </div>
      <div class="nav-bar"><span class="pill"></span></div>
    </div>
  </div>
  <script src="../_common/nav.js"></script>
</body>
</html>
