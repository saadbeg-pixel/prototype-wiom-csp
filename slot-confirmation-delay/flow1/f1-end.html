<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>फ्लो 1 पूरा · Wiom CSP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../_common/tokens.css" />
  <link rel="stylesheet" href="../_common/frame.css" />
  <link rel="stylesheet" href="../_common/components.css" />
  <style>
    .recap-card {
      background: rgba(255, 255, 255, 0.65);
      border-radius: var(--radius-card);
      padding: 14px 16px;
      margin-top: 12px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .recap-card__check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--state-positive);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .recap-card__text {
      font-size: var(--t-body);
      line-height: 20px;
      color: var(--text-primary);
    }
    .recap-card__text strong { font-weight: var(--w-bold); }

    .recap-hero {
      font-size: 26px;
      font-weight: var(--w-bold);
      line-height: 32px;
      margin-top: 12px;
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="frame-hint">flow 1 · end — recap</div>
  <div class="phone-bezel">
    <div class="phone-notch"></div>
    <div class="phone-screen">
      <div class="status-bar yellow"><span>2:15</span><span class="status-icons">●●● 􀙇 84%</span></div>
      <div class="screen-content yellow">
        <div class="context">
          <span class="context__step">फ्लो 1 पूरा</span>
          <h1 class="recap-hero">हो गया · 2 दिन की चिंता बच गई</h1>

          <div class="recap-card">
            <span class="recap-card__check">✓</span>
            <span class="recap-card__text">
              <strong>पार्टनर ने कुछ नहीं किया</strong> — पूरा सिस्टम संभाला
            </span>
          </div>
          <div class="recap-card">
            <span class="recap-card__check">✓</span>
            <span class="recap-card__text">
              <strong>कनेक्शन को कभी पुरानी तारीख नहीं दिखी</strong> — हमेशा अगला दिन
            </span>
          </div>
          <div class="recap-card">
            <span class="recap-card__check">✓</span>
            <span class="recap-card__text">
              <strong>बोनस सेफ रहा</strong> — इस दौरान कोई असर नहीं
            </span>
          </div>
          <div class="recap-card">
            <span class="recap-card__check">✓</span>
            <span class="recap-card__text">
              <strong>जवाब आते ही PN</strong> — सीधे कार्ड एक्टिव फ़ीड में
            </span>
          </div>

          <div class="context__spacer"></div>
          <button class="btn btn--primary btn--full context__cta context__cta--brand" data-goto="../context/idx.html">
            दूसरा फ्लो देखें →
          </button>
        </div>
      </div>
      <div class="nav-bar"><span class="pill"></span></div>
    </div>
  </div>
  <script src="../_common/nav.js"></script>
</body>
</html>
