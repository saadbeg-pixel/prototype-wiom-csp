<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>व्योम को वापस — कारण · Wiom CSP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../_common/tokens.css" />
  <link rel="stylesheet" href="../_common/frame.css" />
  <link rel="stylesheet" href="../_common/components.css" />
  <style>
    .drill-body { padding: 0 16px 24px; opacity: 0.4; }
  </style>
</head>
<body>
  <div class="frame-hint">flow 3 · f3-5b — exit reason sheet</div>
  <div class="phone-bezel">
    <div class="phone-notch"></div>
    <div class="phone-screen">
      <div class="status-bar light"><span>10:30</span><span class="status-icons">●●● 􀙇 88%</span></div>
      <div class="screen-content app">

        <div class="top-bar">
          <button class="top-bar__icon-btn" data-inert>←</button>
          <span class="top-bar__title">इंस्टॉलेशन · #4821</span>
          <button class="top-bar__icon-btn" data-inert>⋮</button>
        </div>

        <div class="drill-body">
          <div class="banner banner--info">
            <div class="banner__icon-circle">⏳</div>
            <div class="banner__body">
              <div class="banner__title">हम कनेक्शन से समय पूछ रहे हैं</div>
            </div>
          </div>
        </div>

        <!-- Existing exit reason sheet (ExitReasonSheet.kt) -->
        <div class="sheet-scrim" data-inert>
          <div class="sheet sheet--reason">
            <div class="sheet__handle"></div>
            <div class="sheet__title">व्योम को वापस क्यों भेज रहे हैं?</div>

            <div class="reason-row" data-inert>
              <div class="reason-row__radio"></div>
              <div class="reason-row__label">जगह पर पहुँच नहीं पा रहे</div>
            </div>
            <div class="reason-row" data-inert>
              <div class="reason-row__radio"></div>
              <div class="reason-row__label">क्षमता से अधिक</div>
            </div>
            <div class="reason-row is-selected" data-inert>
              <div class="reason-row__radio"></div>
              <div class="reason-row__label">कनेक्शन उपलब्ध नहीं</div>
            </div>
            <div class="reason-row" data-inert>
              <div class="reason-row__radio"></div>
              <div class="reason-row__label">टीम उपलब्ध नहीं</div>
            </div>
            <div class="reason-row" data-inert>
              <div class="reason-row__radio"></div>
              <div class="reason-row__label">अन्य</div>
            </div>

            <div style="height: 32px"></div>

            <div style="display: flex; gap: 12px; width: 100%">
              <button class="btn btn--secondary" style="flex: 1" data-goto="f3-4.html">वापस</button>
              <button class="btn btn--destructive" style="flex: 1" data-goto="../context/idx.html">व्योम को भेजें</button>
            </div>
            <div style="height: 16px"></div>
          </div>
        </div>
      </div>
      <div class="nav-bar"><span class="pill"></span></div>
    </div>
  </div>
  <script src="../_common/nav.js"></script>
</body>
</html>
